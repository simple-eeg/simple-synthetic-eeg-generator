name: Python source tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the CI-only tested dependency snapshot
        run: python -m pip install --require-hashes -r requirements/ci.lock
      - name: Install this checkout without changing that snapshot
        run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pytest
      - name: Reject generated EEG and workflow artefacts
        run: |
          if git ls-files | grep -E '\.(set|fdt|f32le|mat|log|diary)$'; then
            echo 'Generated EEG/workflow artefact is tracked.' >&2
            exit 1
          fi
