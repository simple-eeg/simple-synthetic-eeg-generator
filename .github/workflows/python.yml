name: Python source tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Run the normal setup without source-tree packaging artefacts
        run: |
          ./setup_environment
          test ! -e build
          test ! -e src/simple_synthetic_eeg_generator.egg-info
      - name: Apply the CI-only tested dependency snapshot
        run: ./.venv/bin/python -m pip install --require-hashes -r requirements/ci.lock
      - run: ./.venv/bin/python -m pytest
      - name: Reject generated EEG and workflow artefacts
        run: |
          if git ls-files | grep -E '\.(set|fdt|f32le|mat|log|diary)$'; then
            echo 'Generated EEG/workflow artefact is tracked.' >&2
            exit 1
          fi
