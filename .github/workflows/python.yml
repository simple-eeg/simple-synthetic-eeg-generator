name: Python source tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.6"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/test.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pytest
      - name: Reject generated EEG and workflow artefacts
        run: |
          if git ls-files | grep -E '\.(set|fdt|f32le|mat|log|diary)$'; then
            echo 'Generated EEG/workflow artefact is tracked.' >&2
            exit 1
          fi
