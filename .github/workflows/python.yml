name: Python source tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: .venv/bin/python
          - os: ubuntu-latest
            python: .venv/bin/python
          - os: windows-latest
            python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Run the shared setup without source-tree packaging artefacts
        run: |
          python setup_environment
          test ! -e build
          test ! -e src/simple_synthetic_eeg_generator.egg-info
      - name: Apply the CI-only tested dependency snapshot
        run: ${{ matrix.python }} -m pip install --require-hashes -r requirements/ci.lock
      - run: ${{ matrix.python }} -m pytest
      - name: Reject generated EEG and workflow artefacts
        run: |
          if git ls-files | grep -E '\.(set|fdt|f32le|mat|log|diary)$'; then
            echo 'Generated EEG/workflow artefact is tracked.' >&2
            exit 1
          fi
