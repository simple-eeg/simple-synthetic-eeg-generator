[build-system]
requires = ["setuptools>=76.0.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-synthetic-eeg-generator"
version = "0.1.0"
description = "Seeded generator for the SIMPLE synthetic EEG demonstrator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "SIMPLE project contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
dependencies = [
  "matplotlib>=3.10.0",
  "neurodsp>=2.3.0",
  "numpy>=2.2.2",
  "scipy>=1.15.1",
]

[project.optional-dependencies]
test = ["pytest>=8.3.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
